services:
  - type: web
    name: checkout-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: RECEIVER_ADDRESS
        scope: project
      - key: RELAYER_PRIVATE_KEY
        scope: project
