<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Checkout - Multi-Chain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    .card { 
      background: white; 
      border-radius: 16px; 
      padding: 24px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h2 { text-align: center; margin-bottom: 8px; color: #1a1a1a; }
    .subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 14px; }
    
    .wallet-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 12px; 
      margin-bottom: 20px;
    }
    .wallet-btn { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      padding: 16px 8px; 
      border: 2px solid #e5e7eb; 
      border-radius: 12px; 
      background: white; 
      cursor: pointer; 
      transition: all 0.2s;
      min-height: 90px;
    }
    .wallet-btn:hover { 
      border-color: #667eea; 
      background: #f5f3ff;
      transform: translateY(-2px);
    }
    .wallet-btn.installed {
      border-color: #10b981;
      background: #ecfdf5;
    }
    .wallet-icon { font-size: 28px; margin-bottom: 6px; }
    .wallet-name { font-size: 11px; font-weight: 600; text-align: center; }
    .installed-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #10b981;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
    }
    
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #10b981;
      margin: 16px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #10b981;
    }
    
    .info-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #166534;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .success { 
      background: #ecfdf5; 
      border: 2px solid #10b981; 
      border-radius: 12px;
      padding: 24px; 
      text-align: center;
    }
    .error { 
      background: #fef2f2; 
      border: 2px solid #ef4444; 
      border-radius: 12px;
      padding: 24px; 
      text-align: center;
    }
    
    .back-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="app">
      <div class="loading">
        <div class="spinner"></div>
        <p style="color: #666;">Loading wallets...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.14.0/dist/ethers.umd.min.js"></script>
  <script src="checkout.js"></script>
</body>
</html>
